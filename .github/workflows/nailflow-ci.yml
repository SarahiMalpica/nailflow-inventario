name: Pipeline NailFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run test:coverage

      - name: Ejecutar los quince controles de seguridad
        run: npm run security

      - name: Preparar copia desplegable
        run: |
          mkdir -p dist
          cp -R public src server.js package.json package-lock.json dist/

      - name: Iniciar servidor temporal, comprobar salud y apagarlo
        env:
          HOST: 127.0.0.1
          PORT: '3000'
          DB_PATH: ':memory:'
        run: |
          export JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")"
          node dist/server.js > "$RUNNER_TEMP/nailflow-server.log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/nailflow-server.log"
          }
          trap cleanup EXIT

          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-delay 1 \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:3000/api/health \
            --output "$RUNNER_TEMP/nailflow-health.json"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const health = JSON.parse(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'nailflow-health.json'), 'utf8'
          ));
          assert.equal(health.status, 'ok');
          assert.equal(health.service, 'NailFlow');
          console.log('Health check correcto:', health);
          NODE

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-del-proyecto
          path: evidencias-del-proyecto/
          if-no-files-found: error

      - name: Guardar copia desplegable
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
