name: Despliegue AWS

on:
  workflow_run:
    workflows: ["Pipeline NailFlow"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nailflow-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la version que paso las pruebas
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publicar version para EC2
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
            echo 'Hay un cambio mas reciente en main; se omite esta version.'
            exit 0
          fi
          mkdir -p dist
          cp -R public src server.js package.json package-lock.json dist/
          tar -czf nailflow.tar.gz -C dist .
          HASH="$(sha256sum nailflow.tar.gz | cut -d ' ' -f1)"
          TAG="ec2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg sha "$DEPLOY_SHA" --arg tag "$TAG" --arg checksum "$HASH" \
            '{sha:$sha,tag:$tag,checksum:$checksum}' > manifest.json
          gh release create "$TAG" --target "$DEPLOY_SHA" --draft \
            --title "NailFlow EC2 ${DEPLOY_SHA:0:7}" \
            --notes 'Version aprobada por Pipeline NailFlow. EC2 la instala al arrancar o en su siguiente comprobacion.' \
            nailflow.tar.gz manifest.json
          gh release edit "$TAG" --draft=false --latest
          echo 'Version publicada. La instalacion y salud de EC2 se verifican en el servidor.' >> "$GITHUB_STEP_SUMMARY"
